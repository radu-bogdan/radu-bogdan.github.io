<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes" />
  <title>Pfc Report Analysis</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <meta name="theme-color" content="#0d1117" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script type="module" crossorigin src="/assets/index-CDw1NVUw.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-B3BwxugY.css">
</head>
<body>
  <main class="app">
    <section class="panel card panel--split-left">
      <aside class="sidebar" id="pfcSidebar">
        <div class="logo-container">
          <img src="/assets/logo-CwXHq6dJ.svg" alt="Logo" class="app-logo" />
        </div>
        <div class="sidebar-header">
          <span class="sidebar-title">Columns</span>
          <div class="sidebar-actions">
            <button id="pfcAllColsBtn" type="button" class="help-btn" title="Select all numeric columns" style="padding:2px 6px;">All</button>
            <button id="pfcNoColsBtn" type="button" class="help-btn" title="Select none" style="padding:2px 6px;">None</button>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; padding:4px 4px 0 4px;">
          <input id="pfcColumnSearch" type="text" placeholder="Search columns" style="font-size:10px; padding:4px 6px; border:1px solid var(--color-border); border-radius:6px;">
        </div>
        <div class="selected-wrapper" style="display:flex; flex-direction:column; gap:4px; margin:6px 4px 0 4px;">
          <div class="sidebar-header" style="padding-bottom:2px; border-bottom:1px solid var(--color-border);">
            <span class="sidebar-title">Selected</span>
            <button id="pfcClearSelectedBtn" type="button" class="help-btn" style="padding:2px 6px;" title="Clear selected signals">Clear</button>
          </div>
          <div id="pfcSelectedList" class="signal-list selected-list" aria-label="Selected columns (scrollable)" style="max-height:280px; flex:0 0 auto; padding-bottom:4px;">
            <div id="pfcSelectedEmpty" style="font-size:10px; color:var(--color-muted); padding:4px 2px;">(none)</div>
          </div>
        </div>
        <div id="pfcColumnList" class="signal-list" aria-label="Columns list (scrollable)"></div>
        <div style="margin-top:8px; border-top:1px solid var(--color-border); padding-top:6px; display:flex; flex-direction:column; gap:6px;">
          <span class="sidebar-title">Filters</span>
          <div style="display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; flex-direction:column; gap:4px;">
              <select id="pfcFilterColumn" style="font-size:11px; padding:4px; border:1px solid var(--color-border); border-radius:6px;"></select>
              <div style="display:flex; gap:4px;">
                <input id="pfcFilterMin" type="number" step="any" placeholder="min" class="filter-range-input" />
                <input id="pfcFilterMax" type="number" step="any" placeholder="max" class="filter-range-input" />
              </div>
              <button id="pfcAddFilterBtn" type="button" class="help-btn" style="padding:4px 6px;">Add Filter</button>
            </div>
            <div id="pfcFilterList" style="display:flex; flex-direction:column; gap:4px; max-height:120px; overflow-y:auto; padding-right:2px;"></div>
            <!-- Removed clear filters button (individual removal is enough) -->
            <div style="border-top:1px solid var(--color-border); padding-top:6px; display:flex; flex-direction:column; gap:4px;">
              <span class="sidebar-title">ID Filters</span>
              <div style="display:flex; flex-direction:column; gap:4px;">
                <input id="pfcExtIdInclude" type="text" placeholder="extId include (comma)" style="font-size:10px; padding:4px 6px; border:1px solid var(--color-border); border-radius:6px;" disabled>
                <input id="pfcExtIdExclude" type="text" placeholder="extId exclude (comma)" style="font-size:10px; padding:4px 6px; border:1px solid var(--color-border); border-radius:6px;" disabled>
                <input id="pfcAlloyInclude" type="text" placeholder="alloyCode include (comma)" style="font-size:10px; padding:4px 6px; border:1px solid var(--color-border); border-radius:6px;" disabled>
                <input id="pfcAlloyExclude" type="text" placeholder="alloyCode exclude (comma)" style="font-size:10px; padding:4px 6px; border:1px solid var(--color-border); border-radius:6px;" disabled>
              </div>
            </div>
          </div>
        </div>
      </aside>
      <div class="panel-right">
        <div class="controls-panel">
          <div class="controls-group">
            <span class="controls-title">CONTROLS</span>
            <div class="controls-buttons">
              <button id="pfcFitYBtn" type="button" class="help-btn" title="Fit Y axis to visible X range (Press Y)">↕Y</button>
              <button id="pfcSeqToggleBtn" type="button" class="help-btn" title="Toggle X-axis: Time vs Sequential">T</button>
              <button id="pfcColorWheelBtn" type="button" class="help-btn" title="Cycle colors for all active signals">C</button>
              <button id="pfcLineModeBtn" type="button" class="help-btn" title="Toggle line (L) vs dots (D) mode">L</button>
            </div>
          </div>
          <div class="controls-group" id="pfcTimeFilterGroup">
            <span class="controls-title">TIME FILTER</span>
            <div class="time-filter-controls">
              <input id="pfcTimeRange" type="text" class="datetime-style-input" placeholder="Start — End" readonly title="Click to select date range">
              <button id="pfcTimeRangeClear" type="button" class="clear-btn" title="Clear date range">×</button>
            </div>
          </div>
          <div class="status-group">
            <span class="badge" id="pfcStatus">Drop CSV or Ctrl+O</span>
          </div>
        </div>
        <div id="pfcPlots" class="plots-container">
          <div class="plot-card" id="pfcLinePlotCard">
            <h3 class="plot-title" style="margin:0 0 4px 0;">LINE PLOTS</h3>
            <div class="plot-content" id="pfcLinePlot"></div>
          </div>
          <div class="plot-pair-row">
            <div class="plot-card half" id="pfcHistCard">
              <div class="histogram-controls">
                <h3 class="plot-title" id="pfcHistTitle" style="margin:0;">HISTOGRAM</h3>
                <select id="pfcHistSelect" class="hist-select"></select>
                <div class="hist-slider-group">
                  <input id="pfcHistStepSlider" type="range" min="0" max="200" value="0" class="hist-slider" title="Histogram step size (0=auto)">
                  <span id="pfcHistStepLabel" class="hist-slider-label">auto</span>
                </div>
              </div>
              <div class="plot-content histogram-plot small" id="pfcHistPlot"></div>
            </div>
            <div class="plot-card half" id="pfcXYCard">
              <div class="xy-controls" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <h3 class="plot-title" id="pfcXYTitle" style="margin:0;" title="Click to toggle hollow markers">X-Y SCATTER</h3>
                <select id="pfcXYXSelect" class="hist-select" title="X axis signal"></select>
                <select id="pfcXYYSelect" class="hist-select" title="Y axis signal"></select>
                <button id="pfcXYFitBtn" type="button" class="help-btn" style="margin-left:auto; padding:2px 6px; font-size:10px;" title="Toggle regression fit: none / L2 / L1">F</button>
              </div>
              <div class="plot-content" id="pfcXYPlot" style="height:240px; min-height:200px;"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="app-footer">
    <small>Pfc Report Analysis. Bogdan Radu 2025</small>
  </footer>
  <div id="pfcGlobalDropOverlay" class="global-drop-overlay" aria-hidden="true">Drop CSV to load</div>
</body>
</html>
